name: Build Windows Vauclaire - NSIS
run-name: Build NSIS - ${{ github.ref_name }}

on:
    workflow_dispatch:

permissions:
    contents: read
    actions: read

jobs:
    windows-nsis:
        name: Build NSIS from a CI-validated commit
        runs-on: windows-2022
        timeout-minutes: 60
        defaults:
            run:
                shell: pwsh

        steps:
            - name: Checkout source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Require successful CI for this exact commit
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python packaging/windows-nsis/scripts/check-ci.py --repository $env:GITHUB_REPOSITORY --sha $env:GITHUB_SHA --workflow ci-hospital-windows.yml --output (Join-Path $env:RUNNER_TEMP 'murmure-ci-validation.json')
                  if ($LASTEXITCODE -ne 0) {
                      throw 'The selected commit has not passed the hospital CI. Wait for its success before building.'
                  }

            - name: Prepare build prerequisites
              uses: ./packaging/windows-nsis/setup-build

            - name: Download and verify the pinned speech model
              run: |
                  python packaging/windows-nsis/scripts/prepare-model.py --archive (Join-Path $env:RUNNER_TEMP 'murmure-parakeet.zip')
                  if ($LASTEXITCODE -ne 0) {
                      throw 'Speech model verification failed.'
                  }

            - name: Prepare the verified Visual C++ prerequisite
              run: '& ./packaging/windows-nsis/scripts/prepare-prerequisites.ps1'

            - name: Build the unsigned native NSIS setup
              run: |
                  $bundleDirectory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
                  if (Test-Path -LiteralPath $bundleDirectory) {
                      Remove-Item -LiteralPath $bundleDirectory -Recurse -Force -ErrorAction Stop
                  }
                  pnpm.cmd tauri build --target x86_64-pc-windows-msvc --bundles nsis --config packaging/windows-nsis/tauri.nsis.conf.json --ci --no-sign --verbose

            - name: Prepare NSIS artifact and provenance
              run: |
                  $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' -File)
                  if ($installers.Count -ne 1) {
                      throw 'Expected exactly one NSIS setup.'
                  }
                  $artifactDirectory = 'vauclaire-windows-nsis-artifact'
                  New-Item -ItemType Directory -Path $artifactDirectory -ErrorAction Stop | Out-Null
                  $setupPath = Join-Path $artifactDirectory 'Murmure-Vauclaire-NSIS-Setup.exe'
                  Copy-Item -LiteralPath $installers[0].FullName -Destination $setupPath -ErrorAction Stop
                  $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  $tauri = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
                  $model = Get-Content -LiteralPath 'packaging/windows-nsis/model-source.json' -Raw | ConvertFrom-Json
                  $prerequisites = Get-Content -LiteralPath 'src-tauri/target/nsis-prerequisites/prerequisites-info.json' -Raw | ConvertFrom-Json
                  $ci = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'murmure-ci-validation.json') -Raw | ConvertFrom-Json
                  & ./packaging/windows-nsis/scripts/check-setup-prerequisites.ps1 -SetupPath $setupPath
                  $metadata = [ordered]@{
                      commit = $env:GITHUB_SHA
                      source_ref = $env:GITHUB_REF
                      ci = $ci
                      version = $tauri.version
                      product_name = $tauri.productName
                      identifier = $tauri.identifier
                      target = 'x86_64-pc-windows-msvc'
                      installer_format = 'nsis'
                      install_scope = 'perMachine'
                      installer = (Split-Path -Leaf $setupPath)
                      installer_sha256 = $setupHash
                      model_version = $model.version
                      model_archive_sha256 = (Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'murmure-parakeet.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
                      model_expected_sha256 = $model.sha256
                      webview2 = 'offlineInstaller'
                      vc_redist = $prerequisites.vc_redist
                      signed = $false
                  }
                  $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$artifactDirectory/build-info.json" -Encoding utf8
                  "$setupHash  $($metadata.installer)" | Set-Content -LiteralPath "$artifactDirectory/SHA256SUMS.txt" -Encoding ascii

            - name: Upload NSIS test package
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: murmure-vauclaire-windows-x64-nsis-${{ github.sha }}
                  path: vauclaire-windows-nsis-artifact/
                  retention-days: 7
                  compression-level: 0
                  if-no-files-found: error
