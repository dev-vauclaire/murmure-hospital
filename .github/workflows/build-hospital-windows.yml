name: Build Windows hospitalier
run-name: Build setup - ${{ github.ref_name }}

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: windows-2022
        timeout-minutes: 60
        defaults:
            run:
                shell: pwsh

        steps:
            - name: Checkout source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Check application versions
              shell: python
              run: |
                  import json
                  import re
                  import tomllib
                  from pathlib import Path

                  package = json.loads(Path('package.json').read_text(encoding='utf-8'))
                  tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
                  cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text(encoding='utf-8'))
                  lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text(encoding='utf-8'))
                  locked = [p for p in lock['package'] if p['name'] == cargo['package']['name'] and 'source' not in p]
                  if len(locked) != 1:
                      raise SystemExit('Expected exactly one application entry in Cargo.lock.')
                  versions = [package['version'], tauri['version'], cargo['package']['version'], locked[0]['version']]
                  if len(set(versions)) != 1:
                      raise SystemExit(f'Application versions are not aligned: {versions}')
                  if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', versions[0]) is None:
                      raise SystemExit('The setup requires a numeric major.minor.patch application version.')
                  major, minor, patch = map(int, versions[0].split('.'))
                  if major > 255 or minor > 255 or patch > 65535:
                      raise SystemExit('The application version exceeds MSI version limits.')
                  print(f'Application versions aligned: {versions[0]}')

            - name: Check Windows packaging scripts
              run: |
                  python packaging/windows/test-installer-options.py
                  if ($LASTEXITCODE -ne 0) {
                      throw 'MSI installer option checks failed.'
                  }
                  python packaging/windows/test-bootstrapper.py
                  if ($LASTEXITCODE -ne 0) {
                      throw 'Windows packaging checks failed.'
                  }
                  & ./packaging/windows/test-bootstrapper.ps1 -SyntaxOnly

            - name: Check hospital default files
              run: |
                  foreach ($referenceName in @('default-settings.json', 'default-dictionnary.json', 'default-formatting-rules.json')) {
                      $referencePath = Join-Path 'resources/hospital' $referenceName
                      if (-not (Test-Path -LiteralPath $referencePath -PathType Leaf)) {
                          throw "A hospital default file is missing: $referenceName"
                      }
                      git ls-files --error-unmatch -- $referencePath | Out-Null
                      if ($LASTEXITCODE -ne 0) {
                          throw "Hospital default files must be tracked by Git: $referenceName"
                      }
                      try {
                          $reference = Get-Content -LiteralPath $referencePath -Raw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
                      } catch {
                          throw "A hospital default file contains invalid JSON: $referenceName"
                      }
                      if ($reference -isnot [System.Collections.IDictionary]) {
                          throw "Hospital default files must be JSON objects: $referenceName"
                      }
                  }

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'

            - name: Set up Rust MSVC
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
              with:
                  toolchain: '1.98.1'
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust dependencies
              uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: npm.cmd install -g pnpm@10.19.0 --ignore-scripts

            - name: Install or locate NASM
              run: |
                  $nasmCommand = Get-Command nasm.exe -ErrorAction SilentlyContinue
                  if ($nasmCommand) {
                      $nasmExecutable = $nasmCommand.Source
                  } else {
                      choco install nasm --yes --no-progress --limit-output
                      if ($LASTEXITCODE -ne 0) {
                          throw 'NASM installation failed.'
                      }
                      $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
                      $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
                      $env:Path = "$machinePath;$userPath;$env:Path"
                      $nasmCommand = Get-Command nasm.exe -ErrorAction SilentlyContinue
                      if ($nasmCommand) {
                          $nasmExecutable = $nasmCommand.Source
                      } else {
                          $nasmExecutable = Join-Path $env:ProgramFiles 'NASM/nasm.exe'
                          if (-not (Test-Path -LiteralPath $nasmExecutable -PathType Leaf)) {
                              throw 'The NASM executable could not be located.'
                          }
                      }
                      $nasmDirectory = Split-Path -Parent $nasmExecutable
                      $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  }
                  & $nasmExecutable -v
                  if ($LASTEXITCODE -ne 0) {
                      throw 'NASM could not be executed.'
                  }

            - name: Install frontend dependencies
              run: pnpm.cmd install --frozen-lockfile --ignore-scripts

            - name: Prepare the verified MSI option template
              run: |
                  python packaging/windows/prepare-installer-options.py
                  if ($LASTEXITCODE -ne 0) {
                      throw 'MSI installer option template preparation failed.'
                  }

            - name: Test hospital rule presentation
              run: pnpm.cmd test:hospital-rules

            - name: Download and check the speech model
              run: |
                  $modelArchive = Join-Path $env:RUNNER_TEMP 'murmure-parakeet-1.3.0.zip'
                  Invoke-WebRequest -Uri 'https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip' -OutFile $modelArchive -ErrorAction Stop
                  Expand-Archive -LiteralPath $modelArchive -DestinationPath 'resources' -Force -ErrorAction Stop
                  $modelDirectory = 'resources/parakeet-tdt-0.6b-v3-int8'
                  foreach ($modelFile in @('encoder-model.int8.onnx', 'decoder_joint-model.int8.onnx', 'nemo128.onnx', 'vocab.txt')) {
                      $modelPath = Join-Path $modelDirectory $modelFile
                      if (-not (Test-Path -LiteralPath $modelPath -PathType Leaf) -or (Get-Item -LiteralPath $modelPath).Length -eq 0) {
                          throw "The speech model is missing a required file: $modelFile"
                      }
                  }
                  if (-not (Test-Path -LiteralPath 'resources/tokenizer.json' -PathType Leaf)) {
                      throw 'The tokenizer resource is missing.'
                  }

            # Tauri's build script needs this resource directory for Rust tests.
            - name: Build SmartMic resources
              run: pnpm.cmd build:smartmic

            - name: Test hospital defaults and SpeechMike protocol
              working-directory: src-tauri
              run: |
                  foreach ($testFilter in @('settings::', 'dictionary::store::', 'formatting_rules::store::', 'utils::defaults::', 'speechmike::', 'shortcuts::', 'cli::cli::tests::speechmike_diagnostic')) {
                      cargo test --locked --lib $testFilter
                      if ($LASTEXITCODE -ne 0) {
                          throw "Hospital defaults tests failed: $testFilter"
                      }
                  }

            - name: Build the unsigned MSI
              run: pnpm.cmd tauri build --bundles msi --config packaging/windows/tauri.setup.conf.json --ci --no-sign

            - name: Build offline setup with embedded prerequisites
              run: |
                  $msiFiles = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File)
                  if ($msiFiles.Count -ne 1) {
                      throw 'Expected exactly one MSI to wrap.'
                  }
                  # Burn v3 needs a new four-part version for each published build.
                  # GITHUB_RUN_NUMBER stays identical on rerun; RUN_ATTEMPT avoids duplicates.
                  $bundleRevision = ([long]$env:GITHUB_RUN_NUMBER * 100) + [long]$env:GITHUB_RUN_ATTEMPT
                  if ([long]$env:GITHUB_RUN_ATTEMPT -ge 100 -or $bundleRevision -gt 65535) {
                      throw 'The bundle revision exceeds its range. Review the revision scheme before publishing another setup.'
                  }
                  $artifactDirectory = 'hospital-windows-artifact'
                  New-Item -ItemType Directory -Path $artifactDirectory -ErrorAction Stop | Out-Null
                  & ./packaging/windows/build-bootstrapper.ps1 -MsiPath $msiFiles[0].FullName `
                      -OutputDirectory (Resolve-Path $artifactDirectory).Path `
                      -BundleRevision $bundleRevision `
                      -WorkingDirectory (Join-Path $env:RUNNER_TEMP "murmure-bootstrapper-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")

            - name: Prepare build metadata
              run: |
                  $artifactDirectory = 'hospital-windows-artifact'
                  $setup = Get-Content -LiteralPath "$artifactDirectory/bootstrapper-info.json" -Raw | ConvertFrom-Json
                  $commit = git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0) {
                      throw 'The source commit could not be determined.'
                  }
                  $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
                  $modelArchive = Join-Path $env:RUNNER_TEMP 'murmure-parakeet-1.3.0.zip'
                  $metadata = [ordered]@{
                      commit = $commit
                      source_ref = $env:GITHUB_REF
                      version = $version
                      target = 'x86_64-pc-windows-msvc'
                      installer_format = 'setup'
                      install_scope = 'perMachine'
                      model_version = '1.3.0'
                      model_archive_sha256 = (Get-FileHash -LiteralPath $modelArchive -Algorithm SHA256).Hash.ToLowerInvariant()
                      installer = $setup.setup
                      installer_sha256 = $setup.setup_sha256
                      msi = $setup.msi
                      msi_sha256 = $setup.msi_sha256
                      bundle_version = $setup.bundle_version
                      vc_redist = $setup.vc_redist
                      webview2 = $setup.webview2
                      wix_version = $setup.wix_version
                      wix_sha256 = $setup.wix_sha256
                      signed = $false
                  }
                  $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$artifactDirectory/build-info.json" -Encoding utf8
                  # The MSI is embedded in the setup, not distributed as a second installer.
                  "$($setup.setup_sha256)  $($setup.setup)" | Set-Content -LiteralPath "$artifactDirectory/SHA256SUMS.txt" -Encoding ascii

            - name: Upload Windows test package
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: murmure-hospital-windows-x64-setup-${{ github.sha }}
                  path: hospital-windows-artifact/
                  retention-days: 7
                  compression-level: 0
                  if-no-files-found: error
