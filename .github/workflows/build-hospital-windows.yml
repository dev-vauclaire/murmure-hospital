name: Build Windows hospitalier
run-name: Build ${{ inputs.installer_format }} - ${{ github.ref_name }}

on:
    workflow_dispatch:
        inputs:
            installer_format:
                description: Format d'installation
                type: choice
                required: true
                default: exe
                options:
                    - exe
                    - msi

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: windows-2022
        timeout-minutes: 60
        defaults:
            run:
                shell: pwsh

        steps:
            - name: Checkout source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Select installer format
              id: installer
              env:
                  REQUESTED_INSTALLER_FORMAT: ${{ inputs.installer_format }}
              run: |
                  switch -CaseSensitive ($env:REQUESTED_INSTALLER_FORMAT) {
                      'exe' {
                          $installerFormat = 'exe'
                          $bundle = 'nsis'
                          $filePattern = '*-setup.exe'
                          $installScope = 'currentUser'
                          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
                          if ($config.bundle.windows.nsis.installMode -ne 'currentUser') {
                              throw 'The EXE installer must be configured for the current user.'
                          }
                      }
                      'msi' {
                          $installerFormat = 'msi'
                          $bundle = 'msi'
                          $filePattern = '*.msi'
                          $installScope = 'perMachine'
                      }
                      default {
                          throw 'Unsupported installer format. Choose exe or msi.'
                      }
                  }
                  "format=$installerFormat" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "file_pattern=$filePattern" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "install_scope=$installScope" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

            - name: Check hospital default files
              run: |
                  foreach ($referenceName in @('default-settings.json', 'default-dictionnary.json', 'default-formatting-rules.json')) {
                      $referencePath = Join-Path 'resources/hospital' $referenceName
                      if (-not (Test-Path -LiteralPath $referencePath -PathType Leaf)) {
                          throw "A hospital default file is missing: $referenceName"
                      }
                      git ls-files --error-unmatch -- $referencePath | Out-Null
                      if ($LASTEXITCODE -ne 0) {
                          throw "Hospital default files must be tracked by Git: $referenceName"
                      }
                      try {
                          $reference = Get-Content -LiteralPath $referencePath -Raw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
                      } catch {
                          throw "A hospital default file contains invalid JSON: $referenceName"
                      }
                      if ($reference -isnot [System.Collections.IDictionary]) {
                          throw "Hospital default files must be JSON objects: $referenceName"
                      }
                  }

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '22'

            - name: Set up Rust MSVC
              uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
              with:
                  toolchain: '1.98.1'
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust dependencies
              uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
              with:
                  workspaces: './src-tauri -> target'

            - name: Install pnpm
              run: npm.cmd install -g pnpm@10.19.0 --ignore-scripts

            - name: Install or locate NASM
              run: |
                  $nasmCommand = Get-Command nasm.exe -ErrorAction SilentlyContinue
                  if ($nasmCommand) {
                      $nasmExecutable = $nasmCommand.Source
                  } else {
                      choco install nasm --yes --no-progress --limit-output
                      if ($LASTEXITCODE -ne 0) {
                          throw 'NASM installation failed.'
                      }
                      $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
                      $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
                      $env:Path = "$machinePath;$userPath;$env:Path"
                      $nasmCommand = Get-Command nasm.exe -ErrorAction SilentlyContinue
                      if ($nasmCommand) {
                          $nasmExecutable = $nasmCommand.Source
                      } else {
                          $nasmExecutable = Join-Path $env:ProgramFiles 'NASM/nasm.exe'
                          if (-not (Test-Path -LiteralPath $nasmExecutable -PathType Leaf)) {
                              throw 'The NASM executable could not be located.'
                          }
                      }
                      $nasmDirectory = Split-Path -Parent $nasmExecutable
                      $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  }
                  & $nasmExecutable -v
                  if ($LASTEXITCODE -ne 0) {
                      throw 'NASM could not be executed.'
                  }

            - name: Install frontend dependencies
              run: pnpm.cmd install --frozen-lockfile --ignore-scripts

            - name: Download and check the speech model
              run: |
                  $modelArchive = Join-Path $env:RUNNER_TEMP 'murmure-parakeet-1.3.0.zip'
                  Invoke-WebRequest -Uri 'https://github.com/Kieirra/murmure-model/releases/download/1.3.0/parakeet-tdt-0.6b-v3-int8.zip' -OutFile $modelArchive -ErrorAction Stop
                  Expand-Archive -LiteralPath $modelArchive -DestinationPath 'resources' -Force -ErrorAction Stop
                  $modelDirectory = 'resources/parakeet-tdt-0.6b-v3-int8'
                  foreach ($modelFile in @('encoder-model.int8.onnx', 'decoder_joint-model.int8.onnx', 'nemo128.onnx', 'vocab.txt')) {
                      $modelPath = Join-Path $modelDirectory $modelFile
                      if (-not (Test-Path -LiteralPath $modelPath -PathType Leaf) -or (Get-Item -LiteralPath $modelPath).Length -eq 0) {
                          throw "The speech model is missing a required file: $modelFile"
                      }
                  }
                  if (-not (Test-Path -LiteralPath 'resources/tokenizer.json' -PathType Leaf)) {
                      throw 'The tokenizer resource is missing.'
                  }

            # Tauri's build script needs this resource directory for Rust tests.
            - name: Build SmartMic resources
              run: pnpm.cmd build:smartmic

            - name: Test hospital defaults and settings
              working-directory: src-tauri
              run: |
                  foreach ($testFilter in @('settings::', 'dictionary::store::', 'formatting_rules::store::', 'utils::defaults::')) {
                      cargo test --locked --lib $testFilter
                      if ($LASTEXITCODE -ne 0) {
                          throw "Hospital defaults tests failed: $testFilter"
                      }
                  }

            - name: Build the unsigned installer
              env:
                  TAURI_BUNDLE: ${{ steps.installer.outputs.bundle }}
              run: pnpm.cmd tauri build --bundles "$env:TAURI_BUNDLE" --ci --no-sign

            - name: Prepare installer and build metadata
              env:
                  TAURI_BUNDLE: ${{ steps.installer.outputs.bundle }}
                  INSTALLER_FILE_PATTERN: ${{ steps.installer.outputs.file_pattern }}
                  INSTALLER_FORMAT: ${{ steps.installer.outputs.format }}
                  INSTALLER_SCOPE: ${{ steps.installer.outputs.install_scope }}
              run: |
                  $bundleDirectory = Join-Path 'src-tauri/target/release/bundle' $env:TAURI_BUNDLE
                  $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -Filter $env:INSTALLER_FILE_PATTERN -File -ErrorAction Stop)
                  if ($installers.Count -ne 1) {
                      throw 'Expected exactly one installer for the selected format.'
                  }
                  $commit = git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0) {
                      throw 'The source commit could not be determined.'
                  }
                  $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
                  $artifactDirectory = 'hospital-windows-artifact'
                  New-Item -ItemType Directory -Path $artifactDirectory -ErrorAction Stop | Out-Null
                  $installer = $installers[0]
                  Copy-Item -LiteralPath $installer.FullName -Destination $artifactDirectory -ErrorAction Stop
                  $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$installerHash  $($installer.Name)" | Set-Content -LiteralPath "$artifactDirectory/SHA256SUMS.txt" -Encoding ascii
                  $modelArchive = Join-Path $env:RUNNER_TEMP 'murmure-parakeet-1.3.0.zip'
                  $metadata = [ordered]@{
                      commit = $commit
                      source_ref = $env:GITHUB_REF
                      version = $version
                      target = 'x86_64-pc-windows-msvc'
                      installer_format = $env:INSTALLER_FORMAT
                      install_scope = $env:INSTALLER_SCOPE
                      model_version = '1.3.0'
                      model_archive_sha256 = (Get-FileHash -LiteralPath $modelArchive -Algorithm SHA256).Hash.ToLowerInvariant()
                      installer = $installer.Name
                      installer_sha256 = $installerHash
                      signed = $false
                  }
                  $metadata | ConvertTo-Json | Set-Content -LiteralPath "$artifactDirectory/build-info.json" -Encoding utf8

            - name: Upload Windows test package
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: murmure-hospital-windows-x64-${{ steps.installer.outputs.format }}-${{ github.sha }}
                  path: hospital-windows-artifact/
                  retention-days: 7
                  compression-level: 0
                  if-no-files-found: error
