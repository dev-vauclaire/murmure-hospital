name: Prepare Windows build prerequisites
description: Prepare the Windows toolchain once for validation and NSIS packaging.

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
          with:
              node-version: '22'

        - name: Set up Rust MSVC
          uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
          with:
              toolchain: '1.98.1'
              targets: x86_64-pc-windows-msvc

        - name: Cache Rust dependencies
          uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
          with:
              workspaces: './src-tauri -> target'

        - name: Install pnpm
          shell: pwsh
          run: npm.cmd install -g pnpm@10.19.0 --ignore-scripts

        - name: Install or locate NASM
          shell: pwsh
          run: |
              $nasmCommand = Get-Command nasm.exe -ErrorAction SilentlyContinue
              if (-not $nasmCommand) {
                  choco install nasm --yes --no-progress --limit-output
                  if ($LASTEXITCODE -ne 0) {
                      throw 'NASM installation failed.'
                  }
                  $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
                  $env:Path = "$nasmDirectory;$env:Path"
                  $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
              nasm.exe -v
              if ($LASTEXITCODE -ne 0) {
                  throw 'NASM could not be executed.'
              }

        - name: Install frontend dependencies
          shell: pwsh
          run: pnpm.cmd install --frozen-lockfile --ignore-scripts
